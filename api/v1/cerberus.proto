syntax = "proto3";
option go_package = "github.com/Frex22/cerberus";
package cerberus;

service KeyValueStore {
    rpc put(PutRequest) returns (PutResponse) {}
    rpc get(GetRequest) returns (GetResponse) {}
    rpc delete(DeleteRequest) returns (DeleteResponse) {}
}

message PutRequest {
    string key = 1;
    bytes value = 2;
}

message PutResponse {
    bool success = 1;
}

message GetRequest {
    string key = 1;
}
message GetResponse {
    bytes value = 1;
    bool found = 2; // Indicates if the key was found
}

message DeleteRequest {
    string key = 1;
}

message DeleteResponse {
    bool success = 1;
}
